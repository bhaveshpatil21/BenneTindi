.scene{position:fixed;inset:0;z-index:0;overflow:hidden;
       background:var(--bg-image) var(--bg-focus)/cover no-repeat}
.scene video{position:absolute;inset:0;width:100%;height:100%;display:block;
             object-fit:cover;object-position:var(--bg-focus);
             opacity:0;transition:opacity .9s ease}
.scene video.on{opacity:1}
/* carousel — each slide is its own layer, so a dissolve is just two
   opacities crossing. Nothing ever cuts. */
.slides{position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease}
.slides.on{opacity:1}
.slide{position:absolute;inset:0;background-size:cover;
       background-position:var(--bg-focus);background-repeat:no-repeat;
       opacity:0;transition:opacity var(--dissolve,2.4s) ease-in-out;
       will-change:opacity}
.slide.on{opacity:1}
.wash{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    linear-gradient(to top,    rgba(30,20,10,.86) 0%, rgba(30,20,10,.36) 23%, transparent 48%),
    linear-gradient(to bottom, rgba(16,24,34,.46) 0%, rgba(16,24,34,.11) 12%, transparent 25%);
}
.vignette{position:fixed;inset:0;z-index:2;pointer-events:none;
          box-shadow:inset 0 0 190px 30px rgba(30,20,10,.24)}
.grain{
  position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.06;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>");
}

/* ══════════ TOP BAR ══════════ */
.ui{position:fixed;inset:0;z-index:5;padding:26px clamp(18px,3.4vw,44px);
    padding-top:max(26px,env(safe-area-inset-top));pointer-events:none}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;pointer-events:auto}
.clock{font-size:15px;opacity:.92;text-shadow:0 2px 12px rgba(0,0,0,.6);
       white-space:nowrap;min-width:88px}
.online{display:flex;align-items:center;gap:9px;font-size:15px;opacity:.95;
        text-shadow:0 2px 12px rgba(0,0,0,.6);white-space:nowrap}
.pip{width:9px;height:9px;border-radius:50%;background:#22c55e;flex:none;
     box-shadow:0 0 10px rgba(34,197,94,.9);animation:blink 3s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.45}}
.out{display:flex;gap:24px;min-width:88px;justify-content:flex-end}
.out a{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:500;opacity:.9;
       transition:opacity .2s;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.out a:hover{opacity:1}
.out svg{width:17px;height:17px;flex:none}
.out .arw{width:11px;height:11px;opacity:.7}

/* ══════════ DOCK ══════════ */
.dock{position:fixed;left:0;right:0;bottom:clamp(20px,3.6vh,40px);z-index:6;
      display:flex;flex-direction:column;align-items:center;gap:12px;
      padding:0 16px;padding-bottom:env(safe-area-inset-bottom)}

.glass{
  background:var(--glass);
  backdrop-filter:blur(30px) saturate(1.25);
  -webkit-backdrop-filter:blur(30px) saturate(1.25);
  border:1px solid var(--edge);
  box-shadow:0 28px 74px -24px rgba(0,0,0,.78), inset 0 1px 0 rgba(255,255,255,.13);
}

/* ── the bar itself ── */
.pill{
  width:min(95vw,880px);border-radius:999px;
  padding:12px clamp(14px,1.6vw,20px);
  display:grid;align-items:center;
  /* five children: cover · meta · track · keys · tools */
  grid-template-columns:auto minmax(0,1fr) minmax(0,1.15fr) auto auto;
  gap:clamp(10px,1.4vw,18px);
}
.tools{display:flex;align-items:center;gap:clamp(2px,.6vw,6px)}
.cover{width:56px;height:56px;border-radius:50%;overflow:hidden;flex:none;
       background:rgba(255,255,255,.09);border:1px solid var(--edge);
       box-shadow:0 6px 18px rgba(0,0,0,.45)}
.cover img{width:100%;height:100%;object-fit:cover;transform:scale(1.36);
           opacity:0;transition:opacity .5s;display:block}
.cover img.on{opacity:1}
body.playing .cover{animation:rot 24s linear infinite}
@keyframes rot{to{rotate:360deg}}

.meta{min-width:0}
.ttl{font-size:15px;font-weight:600;line-height:1.32;
     white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{font-size:12.5px;color:var(--muted);
     white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.track{display:flex;flex-direction:column;gap:5px;min-width:0}
.seek{position:relative;height:14px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.seek .rail{position:absolute;left:0;right:0;height:3px;border-radius:2px;background:rgba(255,255,255,.24)}
.seek .fill{position:absolute;left:0;height:3px;border-radius:2px;background:#fff;width:0;transition:width .2s linear}
.seek .dot{position:absolute;left:0;width:10px;height:10px;border-radius:50%;background:#fff;
           translate:-50% 0;transition:left .2s linear;box-shadow:0 1px 6px rgba(0,0,0,.55)}
.time{font-size:11px;color:var(--faint);text-align:center;font-variant-numeric:tabular-nums;
      letter-spacing:.04em}

.keys{display:flex;align-items:center;gap:clamp(6px,1vw,12px)}
.k{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;
   opacity:.82;transition:opacity .18s,background .18s,transform .1s}
.k:hover{opacity:1;background:rgba(255,255,255,.12)}
.k:active{transform:scale(.92)}
.k svg{width:20px;height:20px;fill:#fff}
.k.big{width:52px;height:52px;background:#fff;opacity:1;box-shadow:0 8px 22px rgba(0,0,0,.45)}
.k.big:hover{background:#fff;transform:scale(1.05)}
.k.big svg{fill:#2a1a12;width:21px;height:21px}
.k.list{width:40px;height:40px}
.k.list[aria-expanded="true"]{background:rgba(255,255,255,.18);opacity:1}
.k[disabled]{opacity:.24;pointer-events:none}

/* ══════════ QUEUE ══════════ */
.queue{
  width:min(95vw,880px);border-radius:24px;overflow:hidden;
  display:flex;flex-direction:column;max-height:min(56vh,460px);
  opacity:0;visibility:hidden;transform:translateY(10px);
  transition:opacity .28s ease,transform .28s ease,visibility .28s;
  position:absolute;bottom:calc(100% + 12px);
}
.queue.open{opacity:1;visibility:visible;transform:none;position:static}

.qhead{padding:14px 16px 10px;border-bottom:1px solid rgba(255,255,255,.1);flex:none}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px}
.tab{padding:6px 13px;border-radius:999px;font-size:11.5px;letter-spacing:.1em;
     text-transform:uppercase;color:var(--muted);border:1px solid transparent;
     transition:background .18s,color .18s,border-color .18s}
.tab:hover{background:rgba(255,255,255,.1);color:#fff}
.tab[aria-current="true"]{background:#fff;color:#2a1a12;font-weight:600}

.find{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:8px 14px}
.find svg{width:14px;height:14px;fill:var(--faint);flex:none}
.find input{flex:1;min-width:0;background:none;border:none;color:#fff;font:inherit;font-size:13px}
.find input::placeholder{color:var(--faint)}
.find input:focus{outline:none}
.count{font-size:11px;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}

/* paste any youtube playlist */
.mine{display:none;gap:8px;margin-top:9px}
.mine.on{display:flex}
.mine input{flex:1;min-width:0;background:rgba(255,255,255,.08);color:#fff;font:inherit;
            font-size:12.5px;border:1px solid rgba(255,255,255,.12);border-radius:999px;
            padding:9px 14px}
.mine input::placeholder{color:var(--faint)}
.mine input:focus{outline:none;border-color:rgba(255,255,255,.45)}
.mine button{padding:9px 18px;border-radius:999px;font-size:11px;letter-spacing:.14em;
             text-transform:uppercase;background:#fff;color:#2a1a12;font-weight:600;
             transition:opacity .18s}
.mine button:hover{opacity:.86}

/* set / test the API key without touching code */
.keyrow{display:none;gap:8px;margin-top:8px}
.keyrow.on{display:flex}
.keyrow input{flex:1;min-width:0;background:rgba(255,255,255,.08);color:#fff;font:inherit;
              font-size:12.5px;border:1px solid rgba(255,255,255,.12);border-radius:999px;
              padding:9px 14px;letter-spacing:.08em}
.keyrow input::placeholder{color:var(--faint);letter-spacing:0}
.keyrow input:focus{outline:none;border-color:rgba(255,255,255,.45)}
.keyrow button{padding:9px 16px;border-radius:999px;font-size:11px;letter-spacing:.12em;
               text-transform:uppercase;background:#fff;color:#2a1a12;font-weight:600}
.keyrow button.ghost{background:rgba(255,255,255,.10);color:#fff;
                     border:1px solid rgba(255,255,255,.18)}
.keystat{font-size:11.5px;line-height:1.5;color:var(--muted);padding:8px 4px 0;display:none}
.keystat.on{display:block}
.keystat b{color:#fff;font-weight:600}
.keystat a{text-decoration:underline}

.qlist{overflow-y:auto;overscroll-behavior:contain;padding:8px;flex:1;
       scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.22) transparent}
.qlist::-webkit-scrollbar{width:8px}
.qlist::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border-radius:4px}

.row{display:grid;grid-template-columns:26px 44px minmax(0,1fr) auto;align-items:center;
     gap:12px;width:100%;padding:8px 10px;border-radius:14px;text-align:left;
     transition:background .15s}
.row:hover{background:rgba(255,255,255,.09)}
.row[aria-current="true"]{background:rgba(255,255,255,.14)}
.row .n{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;text-align:right}
.row .th{width:44px;height:44px;border-radius:10px;object-fit:cover;background:rgba(255,255,255,.09);
         display:block}
.row .nm{min-width:0}
.row .nm b{display:block;font-size:13.5px;font-weight:500;line-height:1.35;
           white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm span{display:block;font-size:11.5px;color:var(--muted);
              white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.hide{display:none}

/* three bars, bouncing, on whatever is playing */
.eq{display:flex;align-items:flex-end;gap:2px;height:14px;width:14px;opacity:0}
.row[aria-current="true"] .eq{opacity:1}
.eq i{width:3px;background:#fff;border-radius:1px;height:30%}
body.playing .row[aria-current="true"] .eq i{animation:bounce .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.18s}
.eq i:nth-child(3){animation-delay:.36s}
@keyframes bounce{0%,100%{height:26%}50%{height:100%}}

.empty{padding:30px 16px;text-align:center;font-size:13px;color:var(--muted)}

/* ── spotify station gets its native widget ── */
.spot{width:min(95vw,880px);border-radius:24px;padding:10px;
      opacity:0;visibility:hidden;position:absolute;pointer-events:none;
      transition:opacity .3s,visibility .3s}
.spot.here{opacity:1;visibility:visible;position:static;pointer-events:auto}
.spot iframe{display:block;width:100%;height:352px;border:0;border-radius:16px}
.spot .hint{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
            color:var(--faint);text-align:center;padding:9px 4px 3px}

/* ══════════ DOOR ══════════ */
.door{position:fixed;inset:0;z-index:20;display:grid;place-items:center;text-align:center;
      padding:24px;background:rgba(24,17,9,.54);
      transition:opacity .8s ease,visibility .8s}
.door.open{opacity:0;visibility:hidden;pointer-events:none}
.door .line{font-size:12.5px;letter-spacing:.34em;text-transform:uppercase;opacity:.78;
            font-weight:500;text-shadow:0 2px 14px rgba(0,0,0,.75)}
.enter{margin-top:26px;font-size:12px;letter-spacing:.3em;text-transform:uppercase;font-weight:500;
       color:#2a1a12;background:#fff;padding:16px 38px;border-radius:999px;
       box-shadow:0 16px 44px rgba(0,0,0,.55);transition:letter-spacing .35s,transform .2s}
.enter:hover{letter-spacing:.4em;transform:translateY(-2px)}

#yt{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;top:-200px;left:-200px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:820px){
  /* row 1: art + title + tools · row 2: seek · row 3: transport */
  .pill{grid-template-columns:auto minmax(0,1fr) auto;
        gap:10px 12px;border-radius:24px;padding:13px 15px}
  .cover{grid-area:1/1;width:46px;height:46px}
  .meta {grid-area:1/2}
  .tools{grid-area:1/3}
  .track{grid-area:2/1/2/4}
  .keys {grid-area:3/1/3/4;justify-content:center;gap:14px}
}
@media (max-width:520px){
  .clock,.online span:last-child{font-size:13px}
  .out a span{display:none}
  .out{gap:16px;min-width:0}
  .clock{min-width:0}
  .k{width:36px;height:36px}
  .k svg{width:18px;height:18px}
  .k.big{width:48px;height:48px}
  .tools{gap:0}
  .spot iframe{height:232px}
  .queue{max-height:58vh}
  .row{grid-template-columns:22px 38px minmax(0,1fr) auto;gap:9px}
  .row .th{width:38px;height:38px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition-duration:.01ms!important}
  .scene video{display:none}
}
</style>
</head>

<script>
/* Playback runs on the YouTube IFrame Player API — nothing is hosted here,
   every track streams from its rights holder's own channel.
   Every playlist below was checked to resolve and report a track count. */
const STATIONS = [
  { name:'cafe',    list:'PLb3IqBGKOL3hTMjVY0182DeO233_ItDpu' },  /* Indian lounge · 50  */
  { name:'indie',   list:'PL1gfuz7ZYcaM2Z7sCGOWORCF0CGmonzOv' },  /* Indie India · 40    */
  { name:'lofi',    list:'PLinVjP-aRmluqhaUwqzPf81vg1gC1VYnf' },  /* Hindi lofi · 286    */
  { name:'retro',   list:'PLP7LBOIQKXnC-LDzuYY7o9kX80WTdjE_t' },  /* Saregama · 548      */
  { name:'sitar',   list:'PLqKfO8peuae3xOZmUVu12Ol736BDq6aKv' },  /* sitar · 24          */
  { name:'spotify', spotify:'4Wgb1FsjIBwtAclf3oM4v8' },

const $ = id => document.getElementById(id);
let player, ready = false, station = 0, vid = null, scrub = false, misses = 0;

/* ── clock ─────────────────────────────── */
setInterval(tick, 1000); tick();
function tick(){
  $('clock').textContent = new Date()
    .toLocaleTimeString('en-IN', {hour:'numeric', minute:'2-digit'}).toLowerCase();
}

/* ── how full the café is ──────────────────
   Follows the clock in your timezone and drifts. Local, not a live
   headcount — a real one needs a websocket server. */
setInterval(room, 5000); room();
function room(){
  const d = new Date(), h = d.getHours() + d.getMinutes()/60;
  const peak = t => Math.exp(-((h-t)**2)/3.4);
  const n = 6 + 24*peak(10.5) + 32*peak(17.5) + 16*peak(21.5)
          + 3*Math.sin(Date.now()/47000) + 2*Math.sin(Date.now()/11000);
  $('count').textContent = Math.max(3, Math.round(n));
}

/* ── youtube ───────────────────────────── */
const s = document.createElement('script');
s.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(s);

window.onYouTubeIframeAPIReady = () => {
  /* The origin param is required on a real host but breaks the player when
     the page is opened straight off disk, where origin is "null". */
  const vars = { listType:'playlist', list:STATIONS[0].list, playsinline:1, controls:0 };
  if (location.protocol === 'http:' || location.protocol === 'https:')
    vars.origin = location.origin;

  player = new YT.Player('yt', {
    host:'https://www.youtube-nocookie.com',
    playerVars: vars,
    events:{
      onReady(){
        ready = true; player.setVolume(75); links(); autoplay();
        setTimeout(buildQueue, 600);
      },
      onStateChange(e){
        const P = YT.PlayerState;
        document.body.classList.toggle('playing', e.data === P.PLAYING);
        icon(e.data === P.PLAYING);
        if (e.data === P.PLAYING || e.data === P.BUFFERING){ read(); markPlaying(); }
        if (e.data === P.ENDED) player.nextVideo();
      },
      /* region-locked or embed-disabled video: step over it */
      onError(){
        if (++misses > 8){ $('title').textContent = 'Kitchen’s shut — try another station'; return; }
        setTimeout(() => player.nextVideo(), 350);
      }
    }
  });
};

function read(){
  const d = player.getVideoData && player.getVideoData();
  if (!d || !d.video_id || d.video_id === vid) return;
  vid = d.video_id; misses = 0;

  const { title, artist } = tidy(d.title || '', d.author || '');
  $('title').textContent  = title;
  $('artist').textContent = artist;
  $('live').textContent   = `Now playing: ${title} — ${artist}`;
  NAMES.set(vid, { title, artist });

  const img = $('cover'); img.classList.remove('on');
  const hi = thumb(vid,'maxresdefault'), lo = thumb(vid,'hqdefault');
  const p = new Image();
  p.onload  = () => img.src = p.naturalWidth > 200 ? hi : lo;
  p.onerror = () => img.src = lo;
  p.src = hi;
  img.onload = () => img.classList.add('on');
}

const thumb = (id, size) => `https://i.ytimg.com/vi/${id}/${size}.jpg`;

/* YouTube titles carry freight: "Song | Film | Singer (Lyrical) 4K".
   Strip the freight, keep the song. */
function tidy(raw, channel){
  const junk = /\b(official|lyrical?|lyrics|video song|full (video|song)|audio|hd|4k|1080p|remastered|jukebox|music video|visuali[sz]er)\b/i;
  const s = raw.replace(/\([^()]*\)|\[[^\[\]]*\]/g, m => junk.test(m) ? '' : m)
               .replace(/\s{2,}/g,' ').trim();
  const parts = s.split(/\s*[|｜]\s*/).map(x => x.trim()).filter(Boolean);
  let title = parts[0] || s, artist = '';
  for (let i = 1; i < parts.length; i++)
    if (parts[i].length <= 44 && !junk.test(parts[i])) { artist = parts[i]; break; }
  if (!artist) artist = channel;
  artist = artist.replace(/\s*-\s*Topic$/i,'').replace(/VEVO$/i,'')
                 .replace(/\bOfficial\b/ig,'').replace(/\s{2,}/g,' ').trim();
  return { title: title.replace(/[-–—\s]+$/,'').trim() || 'Untitled', artist };
}

/* ══════════ THE QUEUE ══════════
   getPlaylist() hands back video IDs but no titles — the API has no bulk
   metadata call. Thumbnails are predictable from the ID, so rows render
   instantly; names arrive from YouTube's oEmbed endpoint, fetched only for
   rows you actually scroll to. NAMES caches across station switches. */
const NAMES = new Map();
let rows = [], watcher = null, loadingAll = false;
let oembedOk = null, oembedFails = 0;   /* null = untested */

/* If titles can't be reached at all, the list still works — thumbnails and
   numbers identify tracks — but search would be dead weight, so it goes. */
function titlesUnavailable(){
  oembedOk = false;
  document.querySelector('.find').style.display = 'none';
  $('qcount').textContent = rows.length + ' tracks';
}

function buildQueue(){
  const list = $('qlist');
  const ids = (ready && player.getPlaylist && player.getPlaylist()) || [];
  if (watcher) watcher.disconnect();
  list.innerHTML = ''; rows = [];

  if (!ids.length){
    list.innerHTML = '<div class="empty">This station is still loading. Try again in a moment.</div>';
    $('qcount').textContent = ''; return;
  }

  watcher = new IntersectionObserver(hits => {
    hits.forEach(h => { if (h.isIntersecting){ name(h.target._i); watcher.unobserve(h.target); } });
  }, { root:list, rootMargin:'220px' });

  const frag = document.createDocumentFragment();
  ids.forEach((id, i) => {
    const b = document.createElement('button');
    b.className = 'row'; b._i = i; b._id = id;
    b.innerHTML =
      `<span class="n">${i+1}</span>` +
      `<img class="th" loading="lazy" alt="" src="${thumb(id,'default')}">` +
      `<span class="nm"><b>Track ${i+1}</b><span></span></span>` +
      `<span class="eq"><i></i><i></i><i></i></span>`;
    b.onclick = () => { player.playVideoAt(i); closeQueue(); };
    rows.push(b); frag.appendChild(b); watcher.observe(b);
  });
  list.appendChild(frag);
  $('qcount').textContent = ids.length + ' tracks';
  markPlaying();
}

/* One title. Cached, and safe to call repeatedly. */
async function name(i){
  if (oembedOk === false) return;
  const b = rows[i]; if (!b || b._done) return;
  b._done = true;
  const id = b._id;
  let n = NAMES.get(id);
  if (!n){
    try{
      const u = 'https://www.youtube.com/oembed?format=json&url=' +
                encodeURIComponent('https://www.youtube.com/watch?v=' + id);
      const r = await fetch(u);
      if (!r.ok) throw 0;
      const j = await r.json();
      n = tidy(j.title || '', j.author_name || '');
      NAMES.set(id, n);
      oembedOk = true; oembedFails = 0;
    }catch(_){
      b._done = false;                       /* let it retry later */
      if (oembedOk === null && ++oembedFails >= 5) titlesUnavailable();
      return;
    }
  }
  b.querySelector('.nm b').textContent    = n.title;
  b.querySelector('.nm span').textContent = n.artist;
  b._text = (n.title + ' ' + n.artist).toLowerCase();
  if ($('find').value) filter();
}

/* Searching needs every name, so the first keystroke pulls the rest in
   small batches rather than firing hundreds of requests at once. */
async function nameAll(){
  if (loadingAll || oembedOk === false) return;
  loadingAll = true;
  for (let i = 0; i < rows.length; i += 6){
    await Promise.all(rows.slice(i, i+6).map(b => name(b._i)));
  }
  loadingAll = false;
}

function filter(){
  const q = $('find').value.trim().toLowerCase();
  let shown = 0;
  rows.forEach(b => {
    const hit = !q || (b._text || '').includes(q);
    b.classList.toggle('hide', !hit);
    if (hit) shown++;
  });
  $('qcount').textContent = q ? `${shown} of ${rows.length}` : `${rows.length} tracks`;
}

$('find').addEventListener('input', () => { nameAll(); filter(); });

function markPlaying(){
  if (!ready || !rows.length || !player.getPlaylistIndex) return;
  const i = player.getPlaylistIndex();
  rows.forEach((b, j) => b.setAttribute('aria-current', String(j === i)));
  const cur = rows[i];
  if (cur && $('queue').classList.contains('open'))
    cur.scrollIntoView({ block:'nearest' });
}

/* ── open / close ──────────────────────── */
function openQueue(){
  if (STATIONS[station].spotify) return;
  $('queue').hidden = false;
  requestAnimationFrame(() => $('queue').classList.add('open'));
  $('toggle').setAttribute('aria-expanded','true');
  if (!rows.length) buildQueue(); else markPlaying();
}
function closeQueue(){
  $('queue').classList.remove('open');
  $('toggle').setAttribute('aria-expanded','false');
  setTimeout(() => { if (!$('queue').classList.contains('open')) $('queue').hidden = true; }, 300);
}
$('toggle').onclick = () =>
  $('queue').classList.contains('open') ? closeQueue() : openQueue();

document.addEventListener('click', e => {
  if (!$('queue').classList.contains('open')) return;
  if (e.target.closest('.queue') || e.target.closest('#toggle')) return;
  closeQueue();
});

/* ── transport ─────────────────────────── */
function icon(playing){
  $('icon').innerHTML = playing ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
  $('play').setAttribute('aria-label', playing ? 'Pause' : 'Play');
}
function toggle(){
  if (!ready) return;
  player.getPlayerState() === YT.PlayerState.PLAYING ? player.pauseVideo() : player.playVideo();
}
$('play').onclick = toggle;
$('next').onclick = () => ready && player.nextVideo();
$('prev').onclick = () => { if (!ready) return;
  player.getCurrentTime() > 3 ? player.seekTo(0, true) : player.previousVideo(); };

setInterval(() => {
  if (!ready || scrub || !player.getDuration) return;
  const d = player.getDuration(), t = player.getCurrentTime();
  if (!d) return;
  paint(t/d); $('cur').textContent = mmss(t); $('dur').textContent = mmss(d);
}, 250);

const mmss = x => (x = Math.max(0, Math.floor(x||0)), Math.floor(x/60)+':'+String(x%60).padStart(2,'0'));
function paint(p){
  p = Math.min(1, Math.max(0, p||0));
  $('fill').style.width = p*100+'%';
  $('dot').style.left   = p*100+'%';
  $('seek').setAttribute('aria-valuenow', Math.round(p*100));
}
const at = x => { const r = $('seek').getBoundingClientRect();
                  const p = Math.min(1, Math.max(0, (x-r.left)/r.width)); paint(p); return p; };
$('seek').addEventListener('pointerdown', e => {
  if (!ready) return; scrub = true; $('seek').setPointerCapture(e.pointerId); at(e.clientX); });
$('seek').addEventListener('pointermove', e => scrub && at(e.clientX));
$('seek').addEventListener('pointerup', e => {
  if (!scrub) return; player.seekTo(at(e.clientX)*player.getDuration(), true); scrub = false; });
$('seek').addEventListener('keydown', e => {
  if (!ready) return; const d = player.getDuration(); if (!d) return;
  if (e.key === 'ArrowRight'){ player.seekTo(Math.min(d, player.getCurrentTime()+5), true); e.preventDefault(); }
  if (e.key === 'ArrowLeft' ){ player.seekTo(Math.max(0, player.getCurrentTime()-5), true); e.preventDefault(); }
});

/* ── stations ──────────────────────────── */
$('tabs').addEventListener('click', e => {
  const b = e.target.closest('.tab'); if (b) tune(Number(b.dataset.s));
});

function tune(i){
  station = i; links();
  document.querySelectorAll('.tab').forEach(b =>
    b.setAttribute('aria-current', String(Number(b.dataset.s) === i)));
  $('mine').classList.toggle('on', !!STATIONS[i].mine);

  /* Spotify runs in its own widget — swap the queue out for it and stop
     YouTube so two things aren't playing over each other. */
  if (STATIONS[i].spotify){
    mountSpotify(STATIONS[i].spotify);
    $('spot').classList.add('here');
    $('queue').classList.remove('open');
    $('queue').hidden = true;
    $('toggle').disabled = true;
    $('toggle').setAttribute('aria-expanded','false');
    if (ready) player.pauseVideo();
    document.body.classList.remove('playing');
    $('title').textContent = 'Your Spotify playlist'; $('artist').textContent = 'playing below';
    return;
  }

  $('spot').classList.remove('here');
  stopSpotify();
  $('toggle').disabled = false;

  /* Nothing loaded yet — wait for a query rather than loading an empty list. */
  if (!STATIONS[i].list){
    $('qlist').innerHTML = '<div class="empty">Search a song, or paste a YouTube link.</div>';
    $('qcount').textContent = ''; rows = [];
    if (!$('queue').classList.contains('open')) openQueue();
    $('plUrl').focus();
    return;
  }

  if (!ready) return;
  vid = null; misses = 0; rows = [];
  $('title').textContent = 'Changing the record…'; $('artist').textContent = '';
  $('find').value = '';
  $('qlist').innerHTML = '<div class="empty">Loading tracks…</div>';
  player.loadPlaylist({ listType:'playlist', list:STATIONS[i].list });
  setTimeout(() => { jump(); buildQueue(); }, 600);
}

/* ══════════ SEARCH & RADIO ══════════
   One box, three kinds of input:
     · a playlist link   → loads it as a station
     · a video link / ID → starts a radio mix seeded from that song
     · anything else     → a search, which needs the key below
   Searching is the only part that needs a key, because the IFrame player has
   no search of its own. This key is visible to anyone who views source — that
   is unavoidable in a browser app, so it MUST be locked to your domain under
   Credentials → Website restrictions in the Google Cloud console.
   Free quota is 10,000 units/day and a search costs 100, so ~100 searches a
   day. Repeat queries come from the cache below and cost nothing. */
/* ══════════ BACKDROP CAROUSEL ══════════
   Put image URLs here and they cross-dissolve behind everything, replacing
   the video. Leave it empty and the video loop plays instead.
   Or paste a shared Drive folder link in the app — see DRIVE_FOLDER below. */
const SLIDES       = [];      // e.g. ['pic1.jpg','pic2.jpg']
const DRIVE_FOLDER = '';      // e.g. '1AbC...'  (folder id, not the whole URL)
const HOLD    = 7000;         // ms each image rests
const DISSOLVE = 2400;        // ms of cross-fade

let slideTimer = null;

/* Only starts once every image has decoded, so the first dissolve is never
   a fade from blank. */
async function carousel(urls){
  const box = $('slides');
  clearInterval(slideTimer);
  box.innerHTML = ''; box.classList.remove('on');
  if (!urls.length){ $('bg').classList.add('on'); return; }

  document.documentElement.style.setProperty('--dissolve', DISSOLVE + 'ms');
  const ok = [];
  await Promise.all(urls.map(u => new Promise(res => {
    const im = new Image();
    im.onload  = () => { ok.push(u); res(); };
    im.onerror = () => res();
    im.src = u;
  })));
  if (!ok.length){ keyStat('None of those images could load — check the folder is shared.'); return; }

  ok.forEach((u, n) => {
    const d = document.createElement('div');
    d.className = 'slide' + (n ? '' : ' on');
    d.style.backgroundImage = `url("${u}")`;
    box.appendChild(d);
  });
  box.classList.add('on');
  $('bg').classList.remove('on');          // video steps aside, still dissolving
  if (ok.length === 1) return;

  let i = 0;
  const kids = [...box.children];
  slideTimer = setInterval(() => {
    kids[i].classList.remove('on');
    i = (i + 1) % kids.length;
    kids[i].classList.add('on');
  }, HOLD + DISSOLVE);
}

/* Drive gives no directory listing without the API, so this asks Drive for
   the folder's contents. The folder must be shared "Anyone with the link",
   and the Drive API must be enabled on the same key as search. */
const RE_FOLDER = /folders\/([A-Za-z0-9_-]{10,})|[?&]id=([A-Za-z0-9_-]{10,})/;

async function loadDrive(raw){
  const m = String(raw).match(RE_FOLDER);
  const id = m ? (m[1] || m[2]) : (/^[A-Za-z0-9_-]{10,}$/.test(raw.trim()) ? raw.trim() : '');
  if (!id) return keyStat('That doesn\u2019t look like a Drive folder link.');
  if (!ytKey) return keyStat('A Google API key is needed to read the folder — set one below.');

  keyStat('Reading the folder\u2026');
  try{
    const u = 'https://www.googleapis.com/drive/v3/files'
            + '?q=' + encodeURIComponent(`'${id}' in parents and mimeType contains 'image/'`)
            + '&fields=files(id,name)&orderBy=name&pageSize=60&key=' + ytKey;
    const r = await fetch(u);
    if (!r.ok){
      let reason = '';
      try{ const j = await r.json(); reason = j.error?.errors?.[0]?.reason || j.error?.status || ''; }catch(_){}
      if (/SERVICE_DISABLED|accessNotConfigured/i.test(reason))
        return keyStat('<b>Google Drive API is not enabled</b> on this key. Console \u2192 Library \u2192 Google Drive API \u2192 Enable. (Separate from the YouTube one.)');
      if (/notFound|forbidden/i.test(reason))
        return keyStat('Folder not readable — set it to <b>Anyone with the link \u2192 Viewer</b>.');
      return keyStat(apiFault(r.status, reason));
    }
    const files = (await r.json()).files || [];
    if (!files.length) return keyStat('No images in that folder.');
    /* This endpoint serves Drive images with the right headers for CSS. */
    await carousel(files.map(f => `https://drive.google.com/thumbnail?id=${f.id}&sz=w1920`));
    keyStat(`<b>${files.length} photos</b> loaded, dissolving every ${(HOLD+DISSOLVE)/1000|0}s.`);
  }catch(e){ keyStat(netFault(e)); }
}
$('driveGo').onclick = () => loadDrive($('driveIn').value);
$('driveIn').addEventListener('keydown', e => { if (e.key === 'Enter') loadDrive($('driveIn').value); });

let ytKey = 'AIzaSyDrJqfYPcp0Eg-mNOWLxxvfJmE2xJMtXNU';
const SEEN = new Map();

/* Turns any failure into plain English. The four things that actually go
   wrong, in the order they usually do. */
function apiFault(status, reason){
  if (/SERVICE_DISABLED|accessNotConfigured/i.test(reason))
    return 'YouTube Data API v3 is <b>not enabled</b> on this key\u2019s Google Cloud project. ' +
           'Console \u2192 APIs &amp; Services \u2192 Library \u2192 YouTube Data API v3 \u2192 Enable.';
  if (/quotaExceeded|dailyLimitExceeded/i.test(reason))
    return 'Today\u2019s quota is spent (100 searches). It resets at midnight Pacific.';
  if (/ipRefererBlocked|referer|requestDenied/i.test(reason))
    return 'The key is restricted and <b>this address is not on its allowed list</b>. ' +
           'Add it under Credentials \u2192 Website restrictions, or drop restrictions while testing.';
  if (/keyInvalid|badRequest|API_KEY_INVALID/i.test(reason) || status === 400)
    return 'The key was <b>rejected</b> \u2014 check for a stray space or a truncated paste.';
  return 'API said: ' + (reason || ('HTTP ' + status));
}

/* A fetch that never reaches Google throws TypeError, which means the page
   was blocked before the request left \u2014 a preview sandbox, an extension,
   or no connection. Worth naming, because it looks identical to a bad key. */
function netFault(e){
  return /Failed to fetch|NetworkError|Load failed/i.test(e.message)
    ? 'The browser <b>blocked the request before it left</b>. Previews and sandboxes often ' +
      'forbid outside calls \u2014 try the deployed site, or open the file over http://localhost.'
    : e.message;
}

function keyStat(html){
  const s = $('keystat');
  s.innerHTML = html; s.classList.toggle('on', !!html);
}

$('keySave').onclick = () => {
  const v = $('keyIn').value.trim();
  if (!v) return keyStat('Paste a key first.');
  ytKey = v; SEEN.clear();
  keyStat('Key set for this visit. To keep it, replace <b>ytKey</b> at the top of the script.');
};

$('keyTest').onclick = async () => {
  if (!ytKey) return keyStat('No key set.');
  keyStat('Testing\u2026');
  try{
    const r = await fetch('https://www.googleapis.com/youtube/v3/search?part=snippet&type=video'
                        + '&maxResults=1&q=test&key=' + ytKey);
    if (r.ok) return keyStat('<b>Working.</b> Search is live.');
    let reason = '';
    try{ const j = await r.json(); reason = j.error?.errors?.[0]?.reason || j.error?.status || ''; }catch(_){}
    keyStat(apiFault(r.status, reason));
  }catch(e){ keyStat(netFault(e)); }
};

/* The search button on the player jumps straight here. */
$('find2').onclick = () => {
  tune(6);
  openQueue();
  $('keyrow').classList.add('on');
  setTimeout(() => $('plUrl').focus(), 60);
};

/* YouTube builds an endless "mix" for any video under the id RD<videoId>.
   That is the similar-songs engine, and it needs no key at all. */
function radio(id, label){
  if (!ready || !id) return;
  vid = null; misses = 0; rows = [];
  station = 6;
  document.querySelectorAll('.tab').forEach(b =>
    b.setAttribute('aria-current', String(b.dataset.s === '6')));
  $('mine').classList.add('on');
  $('spot').classList.remove('here'); stopSpotify();
  $('toggle').disabled = false;
  $('title').textContent = label || 'Tuning the radio…';
  $('artist').textContent = 'more like this';
  $('qlist').innerHTML = '<div class="empty">Building a mix…</div>';
  player.loadPlaylist({ listType:'playlist', list:'RD' + id });
  setTimeout(buildQueue, 1200);
}

/* "More like this" — reseeds from whatever is playing right now. */
$('radio').onclick = () => { if (vid) radio(vid, $('title').textContent); };

const RE_LIST  = /[?&]list=([A-Za-z0-9_-]{12,})/;
const RE_VIDEO = /(?:v=|youtu\.be\/|\/shorts\/|\/embed\/|\/live\/)([A-Za-z0-9_-]{11})/;

function go(){
  const q = $('plUrl').value.trim();
  if (!q || !ready) return;

  const list = q.match(RE_LIST);
  if (list){ STATIONS[6].list = list[1]; STATIONS[6].name = 'search'; return tune(6); }

  const v = q.match(RE_VIDEO) || (/^[A-Za-z0-9_-]{11}$/.test(q) ? [null, q] : null);
  if (v) return radio(v[1]);

  search(q);
}
$('plGo').onclick = go;
$('plUrl').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });

async function search(q){
  const list = $('qlist');
  const key = q.toLowerCase();
  if (!$('queue').classList.contains('open')) openQueue();
  $('keyrow').classList.add('on');

  if (!ytKey){
    list.innerHTML = '<div class="empty">No API key set — add one below, ' +
                     'or paste a YouTube link to play a song and hear similar ones.</div>';
    return;
  }
  /* Every search costs 100 of the 10,000 daily units, so never pay twice. */
  if (SEEN.has(key)) return results(SEEN.get(key));

  list.innerHTML = '<div class="empty">Searching…</div>';
  try{
    const u = 'https://www.googleapis.com/youtube/v3/search?part=snippet&type=video'
            + '&videoEmbeddable=true&videoCategoryId=10&maxResults=20&q='
            + encodeURIComponent(q) + '&key=' + ytKey;
    const r = await fetch(u);

    if (!r.ok){
      let reason = '';
      try{ const j = await r.json(); reason = j.error?.errors?.[0]?.reason || j.error?.status || ''; }catch(_){}
      list.innerHTML = '<div class="empty">Search unavailable.</div>';
      keyStat(apiFault(r.status, reason));
      return;
    }

    const items = (await r.json()).items || [];
    if (!items.length){ list.innerHTML = '<div class="empty">Nothing found.</div>'; return; }
    const out = items.map(i => ({
      id: i.id.videoId,
      ...tidy(i.snippet.title || '', i.snippet.channelTitle || '')
    }));
    SEEN.set(key, out);
    keyStat('');
    results(out);
  }catch(e){
    list.innerHTML = '<div class="empty">Search unavailable.</div>';
    keyStat(netFault(e));
  }
}

/* Search hits reuse the queue rows; picking one seeds a mix from it. */
function results(items){
  const list = $('qlist');
  if (watcher) watcher.disconnect();
  list.innerHTML = ''; rows = [];
  const frag = document.createDocumentFragment();
  items.forEach((t, n) => {
    const b = document.createElement('button');
    b.className = 'row';
    b.innerHTML =
      `<span class="n">${n+1}</span>` +
      `<img class="th" loading="lazy" alt="" src="${thumb(t.id,'default')}">` +
      `<span class="nm"><b></b><span></span></span>` +
      `<span class="eq"><i></i><i></i><i></i></span>`;
    b.querySelector('.nm b').textContent    = t.title;
    b.querySelector('.nm span').textContent = t.artist;
    b.onclick = () => { radio(t.id, t.title); closeQueue(); };
    frag.appendChild(b);
  });
  list.appendChild(frag);
  $('qcount').textContent = items.length + ' results';
}

function links(){
  const s = STATIONS[station];
  if (s.list) $('ytm').href = 'https://www.youtube.com/playlist?list=' + s.list;
}

/* Built on first use so the widget doesn't load with the page. */
function mountSpotify(id){
  const mount = $('spotMount');
  if (mount.firstChild) return;
  const f = document.createElement('iframe');
  f.src = `https://open.spotify.com/embed/playlist/${id}?utm_source=generator&theme=0`;
  f.allow = 'autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture';
  f.setAttribute('allowfullscreen',''); f.loading = 'lazy'; f.title = 'Spotify playlist';
  mount.appendChild(f);
}
/* Reloading the src is the only way to silence a cross-origin embed. */
function stopSpotify(){ const f = $('spotMount').firstChild; if (f) f.src = f.src; }

/* ── the backdrop loop ─────────────────────
   It carries no audio track at all, and muted + playsinline is the one
   combination every browser lets autoplay. If a browser still refuses,
   the first interaction starts it and the still shows until then. */
(function backdrop(){
  const v = $('bg');
  if (SLIDES.length)          carousel(SLIDES);
  else if (DRIVE_FOLDER)      loadDrive(DRIVE_FOLDER);
  if (!v || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  v.muted = true;                       // property, not just the attribute
  v.src = BACKDROP;
  v.addEventListener('playing', () => v.classList.add('on'), { once:true });
  const go = () => v.play().catch(() => {});
  go();
  ['pointerdown','keydown','touchstart'].forEach(e =>
    document.addEventListener(e, go, { once:true, passive:true }));
})();

/* ── starting the music ────────────────────
   Land on a random track, bounded by the playlist's real length — some
   stations hold 24 items, others 548. */
function jump(){
  const n = (player.getPlaylist && player.getPlaylist() || []).length || 20;
  player.playVideoAt(Math.floor(Math.random() * n));
}

/* Browsers refuse to play audio until the visitor has interacted with the
   page, so something has to be clicked. Rather than demanding the button
   specifically, the FIRST touch, click or keypress anywhere counts. */
let started = false;
function start(){
  if (started) return;
  started = true;
  $('door').classList.add('open');
  const go = setInterval(() => { if (!ready) return; clearInterval(go); jump(); }, 120);
}

/* Chrome remembers domains where you've played media before and will let
   those autoplay. Worth a try — if refused, the door waits for a click. */
function autoplay(){
  if (started) return;
  jump();
  setTimeout(() => {
    if (!started && player.getPlayerState() === YT.PlayerState.PLAYING){
      started = true; $('door').classList.add('open');
    }
  }, 700);
}

$('enter').onclick = start;
$('door').addEventListener('click', start);
['pointerdown','keydown','touchstart'].forEach(ev =>
  document.addEventListener(ev, start, { once:true, passive:true }));

/* If the API never answers — offline, blocked, or opened over file:// —
   say so instead of sitting on a stale label. */
setTimeout(() => {
  if (ready) return;
  $('title').textContent  = 'Player did not load';
  $('artist').textContent = location.protocol === 'file:'
    ? 'Serve the folder over http, not file://'
    : 'Check your connection or any blockers';
}, 9000);

document.addEventListener('keydown', e => {
  if (e.target.matches('input')) return;
  if (e.code === 'Space'){ e.preventDefault(); toggle(); }
  if (e.key.toLowerCase() === 'n') ready && player.nextVideo();
  if (e.key.toLowerCase() === 'p') ready && player.previousVideo();
  if (e.key === 'Escape') closeQueue();
});
</script>
</body>
